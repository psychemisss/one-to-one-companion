[project]
name = "one-on-one"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "pendulum>=3.2.0",
    "pydantic>=2.13.5",
    "python-decouple>=3.8",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"] # E501: ruff format owns line length; B008: FastAPI's Depends()/Form() defaults are the idiom
